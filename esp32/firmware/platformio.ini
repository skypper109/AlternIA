; PlatformIO Configuration File pour le firmware ESP32 AlternIA
; Compatible avec Adafruit Feather ESP32, ESP32 DevKit V1, NodeMCU-32S

[platformio]
default_envs = featheresp32

[env:featheresp32]
platform = espressif32
board = featheresp32
framework = arduino
monitor_speed = 115200
upload_speed = 460800

lib_deps =
    bblanchon/ArduinoJson @ ^7.0.4
    links2004/WebSockets @ ^2.4.1

build_flags =
    -D CORE_DEBUG_LEVEL=0
