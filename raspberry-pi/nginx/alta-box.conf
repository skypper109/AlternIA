# ==============================================================================
# Configuration Nginx Edge & Cache Local pour Raspberry Pi 5 (Alta-Box)
# Emplacement : /etc/nginx/sites-available/alta-box
# ==============================================================================

# Zone de cache local pour soulager la connexion Internet malienne (3G/4G)
proxy_cache_path /var/cache/nginx/alta_cache levels=1:2 keys_zone=alta_cache:20m max_size=2g inactive=30d use_temp_path=off;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name alta.box alterniabox.local 10.42.0.1 192.168.4.1 device.alterniamali.com localhost _;

    root /var/www/alta-kiosk;
    index index.html;

    client_max_body_size 50M;

    # En-têtes de sécurité
    add_header X-Content-Type-Options "nosniff" always;
    add_header Access-Control-Allow-Origin "*" always;

    # 1. Cache local agressif pour les assets statiques Kiosk (CSS, JS, Fonts, Images)
    location /assets/ {
        alias /var/www/alta-kiosk/assets/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 2. Cache local des fichiers audio TTS (évite de retélécharger la même explication vocale)
    location /api/tts {
        proxy_pass https://api.alterniamali.com/api/tts;
        proxy_set_header Host api.alterniamali.com;
        proxy_ssl_server_name on;
        proxy_cache alta_cache;
        proxy_cache_valid 200 14d;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        add_header X-Cache-Status $upstream_cache_status;
    }

    # 3. Proxy transparent vers l'API Cloud AWS t3.xlarge
    location /api/ {
        proxy_pass https://api.alterniamali.com/api/;
        proxy_http_version 1.1;
        proxy_set_header Host api.alterniamali.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_ssl_server_name on;
        proxy_connect_timeout 15s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # 4. Support WebSocket pour le Kiosk et les boîtiers
    location /ws/ {
        proxy_pass https://api.alterniamali.com/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host api.alterniamali.com;
        proxy_ssl_server_name on;
        proxy_read_timeout 86400s;
    }

    # 5. Application Kiosk Élève (Single Page Application SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
