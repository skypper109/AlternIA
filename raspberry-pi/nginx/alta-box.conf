# ==============================================================================
# Configuration Nginx Edge, Portail Captif & Cache Local (Raspberry Pi 5)
# Emplacement : /etc/nginx/sites-available/alta-box
# Cible officielle : https://device.alterniamali.com
# ==============================================================================

# Zone de cache local pour soulager la bande passante 3G/4G
proxy_cache_path /var/cache/nginx/alta_cache levels=1:2 keys_zone=alta_cache:20m max_size=2g inactive=30d use_temp_path=off;

# ------------------------------------------------------------------------------
# 1. SERVEUR WI-FI HOTSPOT & PORTAIL CAPTIF (Clients Wi-Fi Alta-box1)
#    Redirige automatiquement toute connexion Wi-Fi vers https://device.alterniamali.com
# ------------------------------------------------------------------------------
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name alta.box alterniabox.local 10.42.0.1 192.168.4.1 _;

    # A. Détection Portail Captif Android
    location = /generate_204 {
        return 302 https://device.alterniamali.com;
    }
    location = /gen_204 {
        return 302 https://device.alterniamali.com;
    }

    # B. Détection Portail Captif Apple (iOS, iPadOS, macOS CNA)
    location = /hotspot-detect.html {
        return 302 https://device.alterniamali.com;
    }
    location = /library/test/success.html {
        return 302 https://device.alterniamali.com;
    }
    location = /success.txt {
        return 302 https://device.alterniamali.com;
    }

    # C. Détection Portail Captif Windows & Firefox
    location = /connecttest.txt {
        return 302 https://device.alterniamali.com;
    }
    location = /ncsi.txt {
        return 302 https://device.alterniamali.com;
    }
    location = /canonical.html {
        return 302 https://device.alterniamali.com;
    }

    # D. Accès au miroir local de secours en cas d'absence totale d'Internet
    location /local/ {
        alias /var/www/alta-kiosk/;
        try_files $uri $uri/ /local/index.html;
    }

    # E. Redirection automatique de toute navigation HTTP vers l'interface officielle
    location / {
        return 302 https://device.alterniamali.com$request_uri;
    }
}

# ------------------------------------------------------------------------------
# 2. SERVEUR LOCAL EDGE & MIROIR DE SECOURS (127.0.0.1 / localhost)
#    Utilisé par la sortie HDMI (launch_kiosk.sh) en cas de démarrage hors-ligne
# ------------------------------------------------------------------------------
server {
    listen 80;
    server_name localhost 127.0.0.1;

    root /var/www/alta-kiosk;
    index index.html;

    client_max_body_size 50M;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Access-Control-Allow-Origin "*" always;

    # Assets statiques Kiosk
    location /assets/ {
        alias /var/www/alta-kiosk/assets/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Cache local des fichiers audio TTS
    location /api/tts {
        proxy_pass https://api.alterniamali.com/api/tts;
        proxy_set_header Host api.alterniamali.com;
        proxy_ssl_server_name on;
        proxy_cache alta_cache;
        proxy_cache_valid 200 14d;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        add_header X-Cache-Status $upstream_cache_status;
    }

    # Proxy transparent vers l'API Cloud
    location /api/ {
        proxy_pass https://api.alterniamali.com/api/;
        proxy_http_version 1.1;
        proxy_set_header Host api.alterniamali.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_ssl_server_name on;
        proxy_connect_timeout 15s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Support WebSocket
    location /ws/ {
        proxy_pass https://api.alterniamali.com/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host api.alterniamali.com;
        proxy_ssl_server_name on;
        proxy_read_timeout 86400s;
    }

    # Single Page Application
    location / {
        try_files $uri $uri/ /index.html;
    }
}
