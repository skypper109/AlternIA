version: '3.8'

# ==============================================================================
# AlternIA Docker Compose - Pile Complète avec Auto-Start Garanti (restart: always)
# Optimisé pour AWS EC2 t3.xlarge (4 vCPUs / 16 Go RAM)
# ==============================================================================

services:
  # 1. Base de données Vectorielle Qdrant (RAG Curriculaire)
  qdrant:
    image: qdrant/qdrant:v1.11.0
    container_name: alternia-qdrant
    restart: always
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      - QDRANT__SERVICE__HTTP_PORT=6333
      - QDRANT__SERVICE__GRPC_PORT=6334
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  # 2. Backend API FastAPI + Moteur IA
  backend:
    build:
      context: ../..
      dockerfile: aws-deployment/docker/Dockerfile
    container_name: alternia-backend
    restart: always
    depends_on:
      - qdrant
    ports:
      - "8000:8000"
    volumes:
      - ../../data:/app/data
      - ../../backend/src/db:/app/backend/src/db
    env_file:
      - ../../.env
    environment:
      - VECTOR_DB_PROVIDER=qdrant
      - VECTOR_DB_URL=http://qdrant:6333
      - BACKEND_HOST=0.0.0.0
      - BACKEND_PORT=8000
    deploy:
      resources:
        limits:
          cpus: '3.5'
          memory: 12G

  # 3. Tunnel Cloudflare officiel (Expose automatiquement alterniamali.com sans ouvrir de port public)
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: alternia-tunnel
    restart: always
    command: tunnel --no-autoupdate run
    env_file:
      - ../../.env
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - backend

volumes:
  qdrant_storage:
    name: alternia_qdrant_storage
