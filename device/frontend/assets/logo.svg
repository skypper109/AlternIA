<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 160" width="100%" height="100%" fill="none">
  <defs>
    <!-- Gradients pour enrichir les pétales tout en respectant la charte -->
    <linearGradient id="petaleOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A30"/>
      <stop offset="100%" stop-color="#E65A15"/>
    </linearGradient>
    <linearGradient id="petaleCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#30CBE2"/>
      <stop offset="100%" stop-color="#1FA5B8"/>
    </linearGradient>
    <linearGradient id="petaleBleu" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2A52B2"/>
      <stop offset="100%" stop-color="#1B387E"/>
    </linearGradient>
  </defs>

  <!-- Symbole Tri-Vortex AlternIA -->
  <g transform="translate(20, 10)">
    <!-- Pétale Orange (Haut / Droite) -->
    <path id="petal-orange" d="M 70 8 C 105 20 135 55 140 85 C 120 72 95 65 70 65 C 55 65 42 70 30 80 C 35 50 50 22 70 8 Z" 
          fill="url(#petaleOrange)" />
    
    <!-- Pétale Cyan (Bas / Droite) -->
    <path id="petal-cyan" d="M 140 85 C 135 115 105 138 75 140 C 85 120 85 95 75 75 C 68 62 58 52 45 45 C 75 42 115 55 140 85 Z" 
          fill="url(#petaleCyan)" />

    <!-- Pétale Bleu Royal (Gauche / Bas) -->
    <path id="petal-blue" d="M 10 90 C 8 55 35 22 70 8 C 58 28 58 55 68 75 C 75 88 85 98 98 105 C 68 110 25 108 10 90 Z" 
          fill="url(#petaleBleu)" />

    <!-- Centre négatif doux -->
    <circle cx="72" cy="74" r="14" fill="#FFFFFF" opacity="0.95" />
  </g>

  <!-- Typographie AlternIA -->
  <g transform="translate(180, 105)">
    <!-- "Altern" en Bleu Royal -->
    <text x="0" y="0" font-family="'Outfit', 'Inter', 'Segoe UI', system-ui, sans-serif" font-size="74" font-weight="800" fill="#214392" letter-spacing="-1.5">Altern</text>
    <!-- "i" en Cyan avec point dynamique -->
    <text x="218" y="0" font-family="'Outfit', 'Inter', 'Segoe UI', system-ui, sans-serif" font-size="74" font-weight="800" fill="#26B7CD" letter-spacing="-1.5">i</text>
    <!-- "A" en Cyan majuscule -->
    <text x="240" y="0" font-family="'Outfit', 'Inter', 'Segoe UI', system-ui, sans-serif" font-size="74" font-weight="800" fill="#26B7CD" letter-spacing="-1.5">A</text>
  </g>
</svg>
