<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Alternia – Dispositif Pédagogique Intelligent</title>
  <meta name="description" content="Interface tactile et vocale Liquid Glass du dispositif Alternia pour les lycéens du Mali.">
  <meta name="theme-color" content="#314999">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <!-- Favicon & Touch Icons conformes à la charte Alternia -->
  <link rel="icon" type="image/x-icon" href="assets/icone.ico">
  <link rel="shortcut icon" type="image/x-icon" href="assets/icone.ico">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">

  <!-- Google Fonts officielles (Charte Alternia / Alta) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Tailwind CSS via CDN avec la palette de couleurs officielle Alta -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            display: ['Plus Jakarta Sans', 'Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            alternia: {
              primaire: '#314999',
              'primaire-hover': '#253878',
              'primaire-light': '#EEF2FF',
              secondaire: '#F1851F',
              'secondaire-hover': '#D97316',
              'secondaire-light': '#FFF7ED',
              innovation: '#0284C7',
              'innovation-hover': '#0369A1',
              'innovation-light': '#F0F9FF',
              dark: '#060911',
              surface: '#0B1120',
              surface2: '#111A2E',
              card: '#0F172A',
              border: '#1E293B',
              border2: '#334155'
            }
          }
        }
      }
    }
  </script>

  <!-- KaTeX pour le rendu des formules mathématiques et scientifiques -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>

  <!-- Styles personnalisés Liquid Glass et animations 60fps -->
  <link rel="stylesheet" href="styles.css">
</head>

<body class="bg-alternia-dark text-slate-100 font-display">

  <!-- =========================================================================
       ARRIÈRE-PLAN AMBIANT LIQUID GLOW (LUMIÈRES D'AMBIANCE POUR L'EFFET DE VERRE)
       ========================================================================= -->
  <div class="ambient-glow-layer">
    <div class="ambient-orb orb-primary"></div>
    <div class="ambient-orb orb-innovation"></div>
    <div class="ambient-orb orb-secondary"></div>
  </div>

  <!-- =========================================================================
       BARRE SUPÉRIEURE DU DISPOSITIF (HEADER FLOTTANT SOULÈVEMENT LIQUID GLASS)
       ========================================================================= -->
  <header class="app-topbar floating-glass-panel">
    <!-- Logo Alternia & Badge Portail -->
    <div class="flex items-center gap-3">
      <img src="assets/logo-horizontal.jpeg" alt="Alternia" class="h-9 w-auto object-contain rounded-lg shadow-sm border border-white/10">
      <div class="hidden sm:flex items-center gap-1.5 px-3 py-1 text-[11px] font-bold tracking-wider uppercase bg-[#314999]/20 text-cyan-300 border border-cyan-500/30 rounded-full font-mono">
        <span class="w-1.5 h-1.5 rounded-full bg-cyan-400"></span>
        <span>Portail Lycée Malien</span>
      </div>
    </div>

    <!-- Raccourcis Matériels (Touches 1, 2, 3, 4 du boîtier) -->
    <div class="hidden xl:flex items-center gap-2 bg-slate-900/60 border border-white/10 rounded-full px-3 py-1 text-xs">
      <span class="text-slate-400 font-semibold mr-1 text-[11px]">Touches Box :</span>
      <span class="hardware-btn-pill text-emerald-400 border-emerald-500/30">[1] 10ème</span>
      <span class="hardware-btn-pill text-cyan-400 border-cyan-500/30">[2] 11ème</span>
      <span class="hardware-btn-pill text-purple-400 border-purple-500/30">[3] 12ème</span>
      <span class="hardware-btn-pill text-[#F1851F] border-[#F1851F]/40 bg-[#F1851F]/15">[4] Micro</span>
    </div>

    <!-- Statuts & Télémétrie du dispositif physique -->
    <div class="flex items-center gap-2 md:gap-3">
      <!-- Badge RAG Local -->
      <div id="rag-status-badge" class="glass-status-badge text-cyan-300 border-cyan-500/30">
        <span class="w-2 h-2 rounded-full bg-cyan-400 animate-pulse"></span>
        <span class="font-mono">RAG Local 100% Connecté</span>
      </div>

      <!-- Badge Classe & Matière Active -->
      <div class="hidden lg:flex items-center gap-2 bg-slate-900/70 border border-white/10 rounded-full px-3.5 py-1 text-xs">
        <span id="active-class-label" class="font-bold text-[#F1851F]">10ème (Tronc Commun)</span>
        <span class="text-slate-500">•</span>
        <span id="active-subject-label" class="font-medium text-cyan-300 flex items-center gap-1">Mathématiques</span>
      </div>

      <!-- Boutons de Contrôle Kiosk -->
      <div class="flex items-center gap-2 ml-2 border-l border-white/10 pl-2">
        <!-- Muet / Son -->
        <button id="btn-toggle-mute" class="btn-kiosk-icon" title="Activer / Désactiver la voix">
          <svg class="w-4 h-4 text-cyan-300" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
          </svg>
        </button>

        <!-- Réinitialiser Session -->
        <button id="btn-reset-session" class="btn-kiosk-icon" title="Nouvelle session">
          <svg class="w-4 h-4 text-[#F1851F]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"></path>
            <path d="M21 3v5h-5"></path>
            <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"></path>
            <path d="M8 16H3v5"></path>
          </svg>
        </button>

        <!-- Plein Écran -->
        <button id="btn-fullscreen" class="btn-kiosk-icon" title="Plein écran">
          <svg class="w-4 h-4 text-slate-300" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 3 21 3 21 9"></polyline>
            <polyline points="9 21 3 21 3 15"></polyline>
            <line x1="21" y1="3" x2="14" y2="10"></line>
            <line x1="3" y1="21" x2="10" y2="14"></line>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <!-- =========================================================================
       CORPS PRINCIPAL AVEC GAPS DE SÉPARATION (WORKSPACE TACTILE FLOTTANT)
       ========================================================================= -->
  <main class="app-workspace">

    <!-- =======================================================================
         PANNEAU GAUCHE FLOTTANT : CYBER-VORTEX AI EN CONTINU & MICROPHONE
         ======================================================================= -->
    <aside class="app-sidebar-avatar floating-glass-panel" id="alta-avatar-card">

      <!-- Haut : Statut d'état en direct -->
      <div class="w-full flex justify-center">
        <div id="status-pill" class="glass-status-badge">
          <span id="status-dot" class="w-2 h-2 rounded-full bg-emerald-400 shadow-[0_0_8px_#10B981]"></span>
          <span id="status-text" class="font-semibold text-slate-200">Prêt</span>
        </div>
      </div>

      <!-- Centre : Cyber-Vortex AI Animé Continuellement (Plasma + Gyro + Ondes) -->
      <div class="avatar-hero-container">
        
        <!-- Conteneur Vortex Interactif 60 FPS -->
        <div class="vortex-interactive-wrapper" id="alta-vortex-hub" title="ALTA Core - Enseignant IA (Cliquez pour tester)">
          <!-- 1. Halo plasma conique animé 24/7 -->
          <div class="vortex-plasma-aura"></div>
          
          <!-- 2. Gyroscope externe à rotation inverse -->
          <div class="vortex-gyro-outer"></div>
          
          <!-- 3. Gyroscope interne à rotation fluide -->
          <div class="vortex-gyro-inner"></div>
          
          <!-- 4. Ondes d'énergie acoustique / radar -->
          <div class="vortex-soundwave-ripple"></div>
          <div class="vortex-soundwave-ripple"></div>
          
          <!-- 5. Cœur Alta Tri-Vortex Gem avec lévitation -->
          <div class="vortex-core-frame">
            <img src="assets/avatar.png" alt="ALTA Core" id="alta-avatar-img">
          </div>
        </div>

        <!-- Identité Enseignant IA (Charte Alta) -->
        <div class="flex flex-col items-center">
          <h2 class="text-lg font-bold text-white tracking-tight flex items-center gap-1.5 font-display">
            <span>ALTA</span>
            <span class="w-1.5 h-1.5 rounded-full bg-cyan-400 shadow-[0_0_6px_#0284C7]"></span>
          </h2>
          <p class="text-xs text-cyan-300 font-medium font-sans">Tuteur Pédagogique Intelligent</p>
          <span class="mt-1 text-[10px] text-slate-400 font-mono bg-white/5 px-2 py-0.5 rounded border border-white/8">Qwen 2.5 • Modèle Local</span>
        </div>

        <!-- Égaliseur 12 barres réactif -->
        <div id="audio-waveform-container" class="pp-hero-waveform opacity-20">
          <span class="pp-hero-wave-bar"></span>
          <span class="pp-hero-wave-bar"></span>
          <span class="pp-hero-wave-bar"></span>
          <span class="pp-hero-wave-bar"></span>
          <span class="pp-hero-wave-bar"></span>
          <span class="pp-hero-wave-bar"></span>
          <span class="pp-hero-wave-bar"></span>
          <span class="pp-hero-wave-bar"></span>
          <span class="pp-hero-wave-bar"></span>
          <span class="pp-hero-wave-bar"></span>
          <span class="pp-hero-wave-bar"></span>
          <span class="pp-hero-wave-bar"></span>
        </div>

      </div>

      <!-- Bas : Gros Bouton Microphone Tactile (Bouton 4) -->
      <div class="w-full flex flex-col items-center gap-2">
        <button id="btn-mic-main" class="btn-mic-liquid" title="Bouton [4] : Toucher pour poser une question vocale">
          <svg class="w-7 h-7 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
            <line x1="12" y1="19" x2="12" y2="22"></line>
          </svg>
        </button>
        <div class="flex items-center gap-1.5 text-xs text-slate-300 font-medium">
          <span class="hardware-btn-pill text-[#F1851F] border-[#F1851F]/40 bg-[#F1851F]/15">Bouton 4</span>
          <span>Parler au Micro</span>
        </div>
      </div>

    </aside>

    <!-- =======================================================================
         PANNEAU DROIT SÉPARÉ : FILTRES DU COURS & ESPACE DE TRAVAIL
         ======================================================================= -->
    <section class="app-main-content">

      <!-- Carte Flottante 1 : Sélecteur de Classes & Matières avec Défis -->
      <div class="curriculum-toolbar-card floating-glass-panel">
        <!-- Ligne 1 : Choix de la classe (Boutons 1, 2, 3) -->
        <div class="flex items-center gap-2 overflow-x-auto pb-0.5" id="class-selector-tabs">
          <!-- Injecté dynamiquement par curriculum-ui.js -->
        </div>

        <!-- Ligne 2 : Choix de la matière -->
        <div class="flex items-center gap-2 overflow-x-auto pb-0.5" id="subject-selector-tabs">
          <!-- Injecté dynamiquement par curriculum-ui.js -->
        </div>

        <!-- Ligne 3 : Suggestions de notions clés & badges gamifiés -->
        <div class="flex items-center gap-2 overflow-x-auto pt-0.5" id="topic-chips-container">
          <!-- Injecté dynamiquement par curriculum-ui.js -->
        </div>
      </div>

      <!-- Carte Flottante 2 : Espace de Conversation & Saisie Tactile -->
      <div class="chat-workspace-card floating-glass-panel">
        
        <!-- Zone de conversation défilable -->
        <div id="chat-scroll-area" class="flex-1 overflow-y-auto p-4 md:p-6 space-y-4">
          <div id="chat-messages-list">
            <!-- Les messages et cartes formules sont injectés ici -->
          </div>
        </div>

        <!-- Barre de saisie inférieure (Liquid Glass) -->
        <div class="p-3 md:p-4 border-t border-white/10 bg-slate-950/40">
          <div class="flex items-center gap-2 bg-slate-900/80 border border-white/12 rounded-2xl p-2 focus-within:border-cyan-400 focus-within:shadow-[0_0_20px_rgba(2,132,199,0.25)] transition-all">
            <input 
              type="text" 
              id="question-input" 
              placeholder="Pose une question de cours (ex: Définis la photosynthèse, Formule de Moivre, Loi de Newton...)"
              class="flex-1 bg-transparent border-none outline-none px-3 text-sm md:text-base text-white placeholder-slate-400 font-sans"
              autocomplete="off"
            >
            <button id="btn-send" class="btn-action-primary" title="Envoyer la question">
              <span>Envoyer</span>
              <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="22" y1="2" x2="11" y2="13"></line>
                <polygon points="22 2 15 22 11 13 2"></polygon>
              </svg>
            </button>
          </div>
        </div>

      </div>

    </section>

  </main>

  <!-- =========================================================================
       MODAL SPOTLIGHT FORMULE PLEIN ÉCRAN (ZOOM TACTILE LIQUID GLASS)
       ========================================================================= -->
  <div id="formula-modal" class="formula-modal-overlay hidden">
    <div class="formula-modal-content">
      <div class="flex items-center justify-between border-b border-white/10 pb-4 mb-4">
        <div class="flex items-center gap-2">
          <span class="w-2.5 h-2.5 rounded-full bg-cyan-400"></span>
          <h3 class="text-lg font-bold text-white tracking-wide">Formule Pédagogique Officielle</h3>
        </div>
        <button id="btn-close-formula-modal" class="btn-kiosk-icon" title="Fermer la vue plein écran">
          <svg class="w-5 h-5 text-slate-300" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
      
      <div id="formula-modal-math" class="text-2xl md:text-3xl text-center py-6 text-cyan-300 font-bold overflow-x-auto font-mono"></div>

      <div class="mt-4 pt-4 border-t border-white/10">
        <h4 class="text-xs uppercase font-bold text-slate-400 tracking-wider mb-2 font-mono">Variables & Unités :</h4>
        <div id="formula-modal-vars" class="flex flex-wrap gap-2 font-sans"></div>
      </div>

      <div id="formula-modal-source" class="text-xs text-slate-400 mt-4 text-right italic font-mono"></div>
    </div>
  </div>

  <!-- Logique applicative modulaire ES6 -->
  <script type="module" src="app.js"></script>
</body>
</html>
