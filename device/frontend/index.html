<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AlternIA - Dispositif Pédagogique Intelligent</title>
  <meta name="description" content="Interface tactile et vocale du dispositif AlternIA pour les lycéens du Mali.">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            alternia: {
              orange: '#F26522',
              cyan: '#26B7CD',
              blue: '#214392',
              dark: '#070D1E',
              card: '#0E1835',
              border: '#1E293B'
            }
          }
        }
      }
    }
  </script>

  <!-- KaTeX pour le rendu des formules mathématiques et scientifiques -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>

  <!-- Styles personnalisés et animations 60fps -->
  <link rel="stylesheet" href="styles.css">
</head>

<body class="bg-alternia-dark text-slate-100 flex flex-col h-screen w-screen overflow-hidden select-none">

  <!-- =========================================================================
       BARRE SUPÉRIEURE DU DISPOSITIF (HEADER KIOSK)
       ========================================================================= -->
  <header class="h-16 px-4 md:px-6 bg-slate-950/80 border-b border-slate-800/80 backdrop-blur-md flex items-center justify-between shrink-0 z-30">
    <!-- Logo AlternIA -->
    <div class="flex items-center gap-3">
      <img src="assets/logo.svg" alt="AlternIA Logo" class="h-9 w-auto object-contain">
      <span class="hidden sm:inline-block px-2.5 py-0.5 text-[11px] font-bold tracking-wider uppercase bg-cyan-950/80 text-cyan-400 border border-cyan-500/30 rounded-full">
        Édition Lycée Malien
      </span>
    </div>

    <!-- Statuts & Télémétrie du dispositif physique -->
    <div class="flex items-center gap-2 md:gap-3">
      <!-- Badge RAG Local -->
      <div id="rag-status-badge" class="status-pill text-xs text-cyan-300 border-cyan-500/30">
        <span class="w-2 h-2 rounded-full bg-cyan-400 animate-pulse"></span>
        <span>RAG Local Prêt</span>
      </div>

      <!-- Badge Classe & Matière Active -->
      <div class="hidden lg:flex items-center gap-2 bg-slate-900 border border-slate-700/60 rounded-full px-3 py-1 text-xs">
        <span id="active-class-label" class="font-bold text-orange-400">12ème (Terminale)</span>
        <span class="text-slate-500">•</span>
        <span id="active-subject-label" class="font-medium text-cyan-300">📐 Mathématiques</span>
      </div>

      <!-- Boutons de Contrôle Kiosk -->
      <div class="flex items-center gap-1.5 ml-2 border-l border-slate-800 pl-2">
        <!-- Muet / Son -->
        <button id="btn-toggle-mute" class="touch-btn p-2 rounded-full bg-slate-900 hover:bg-slate-800 border border-slate-700 text-slate-300" title="Activer / Désactiver la voix">
          <svg class="w-5 h-5 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"></path></svg>
        </button>

        <!-- Réinitialiser Session -->
        <button id="btn-reset-session" class="touch-btn p-2 rounded-full bg-slate-900 hover:bg-slate-800 border border-slate-700 text-slate-300" title="Nouvelle session">
          <svg class="w-5 h-5 text-orange-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
        </button>

        <!-- Plein Écran -->
        <button id="btn-fullscreen" class="touch-btn p-2 rounded-full bg-slate-900 hover:bg-slate-800 border border-slate-700 text-slate-300" title="Plein écran">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"></path></svg>
        </button>
      </div>
    </div>
  </header>

  <!-- =========================================================================
       CORPS PRINCIPAL (LAYOUT DISPOSITIF ÉCRAN TACTILE)
       ========================================================================= -->
  <main class="flex-1 flex flex-col md:flex-row overflow-hidden relative">

    <!-- =======================================================================
         PANNEAU GAUCHE : ALTERNIA CORE (AVATAR VORTEX RÉACTIF 60 FPS)
         ======================================================================= -->
    <section class="w-full md:w-[340px] lg:w-[380px] bg-slate-950/70 border-r border-slate-800/80 flex flex-col items-center justify-between p-4 md:p-6 shrink-0 relative overflow-hidden">
      
      <!-- Halo de fond décoratif -->
      <div class="absolute -top-20 -left-20 w-64 h-64 bg-cyan-600/10 rounded-full blur-3xl pointer-events-none"></div>
      <div class="absolute -bottom-20 -right-20 w-64 h-64 bg-orange-600/10 rounded-full blur-3xl pointer-events-none"></div>

      <!-- Haut : Statut d'état en direct -->
      <div class="w-full flex justify-center">
        <div id="status-pill" class="status-pill text-xs flex items-center gap-2">
          <span id="status-dot" class="status-dot"></span>
          <span id="status-text" class="font-medium text-slate-200">Prêt</span>
        </div>
      </div>

      <!-- Centre : AlternIA Core Vortex Animé -->
      <div id="alternia-core-wrapper" class="state-idle flex flex-col items-center justify-center my-auto py-4">
        <!-- Conteneur SVG Vortex -->
        <div class="vortex-container cursor-pointer" id="alternia-core" title="AlternIA Core - Cliquez pour tester la voix">
          <!-- Insertion directe du symbole Tri-Vortex AlternIA avec calques animés -->
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" fill="none" id="alternia-vortex-svg">
            <defs>
              <linearGradient id="coreOrange" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#FF8238"/>
                <stop offset="100%" stop-color="#E2530F"/>
              </linearGradient>
              <linearGradient id="coreCyan" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#3CE0F8"/>
                <stop offset="100%" stop-color="#19A7BA"/>
              </linearGradient>
              <linearGradient id="coreBlue" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#2E5DE0"/>
                <stop offset="100%" stop-color="#18367F"/>
              </linearGradient>
              <radialGradient id="coreAuraGrad" cx="50%" cy="50%" r="50%">
                <stop offset="0%" stop-color="#26B7CD" stop-opacity="0.4"/>
                <stop offset="50%" stop-color="#214392" stop-opacity="0.15"/>
                <stop offset="100%" stop-color="#F26522" stop-opacity="0"/>
              </radialGradient>
            </defs>

            <!-- Aura lumineuse -->
            <circle cx="100" cy="100" r="92" fill="url(#coreAuraGrad)" class="vortex-aura-pulse" />

            <!-- Ondes acoustiques réactives -->
            <g class="vortex-soundwaves">
              <circle cx="100" cy="100" r="78" stroke="#26B7CD" stroke-width="1.5" stroke-dasharray="4 8" class="wave-ring wave-1" />
              <circle cx="100" cy="100" r="88" stroke="#F26522" stroke-width="1.5" stroke-dasharray="6 12" class="wave-ring wave-2" />
              <circle cx="100" cy="100" r="98" stroke="#214392" stroke-width="1.5" stroke-dasharray="8 16" class="wave-ring wave-3" />
            </g>

            <!-- Groupe Tri-Vortex -->
            <g id="vortex-blades-group">
              <!-- Pétale Orange -->
              <path id="blade-orange" class="vortex-blade" d="M 100 12 C 146 28 186 74 192 114 C 165 96 131 87 97 87 C 76 87 58 94 42 108 C 49 67 70 30 100 12 Z" fill="url(#coreOrange)" />
              <!-- Pétale Cyan -->
              <path id="blade-cyan" class="vortex-blade" d="M 192 114 C 185 155 144 186 103 189 C 117 162 117 128 103 101 C 93 83 80 70 62 60 C 103 56 158 74 192 114 Z" fill="url(#coreCyan)" />
              <!-- Pétale Bleu Royal -->
              <path id="blade-blue" class="vortex-blade" d="M 15 121 C 12 74 49 30 97 11 C 80 38 80 75 94 102 C 103 120 117 133 135 143 C 94 150 35 146 15 121 Z" fill="url(#coreBlue)" />
              <!-- Noyau central -->
              <circle cx="100" cy="102" r="18" fill="#FFFFFF" class="vortex-nucleus" />
              <circle cx="100" cy="102" r="7" fill="#214392" opacity="0.2" />
            </g>
          </svg>
        </div>

        <!-- Visualiseur de spectre audio -->
        <div id="audio-visualizer" class="audio-visualizer-bars mt-4 opacity-25">
          <div class="audio-bar"></div>
          <div class="audio-bar"></div>
          <div class="audio-bar"></div>
          <div class="audio-bar"></div>
          <div class="audio-bar"></div>
          <div class="audio-bar"></div>
          <div class="audio-bar"></div>
        </div>

        <p class="text-xs text-slate-400 font-medium mt-3 text-center">
          Professeur Assistant IA • 100% Hors-Ligne
        </p>
      </div>

      <!-- Bas : Gros Bouton Microphone Tactile -->
      <div class="w-full flex flex-col items-center gap-2">
        <button id="btn-mic-main" class="mic-btn-main" title="Toucher pour poser une question vocale">
          <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"></path>
          </svg>
        </button>
        <span class="text-xs text-slate-400 font-semibold tracking-wide">
          Appuyer pour Parler
        </span>
      </div>

    </section>

    <!-- =======================================================================
         PANNEAU DROIT : ESPACE DE TRAVAIL PÉDAGOGIQUE & SÉLECTEUR
         ======================================================================= -->
    <section class="flex-1 flex flex-col bg-slate-900/50 overflow-hidden">

      <!-- Sélecteur de Classes & Matières (Spécial Lycée Malien) -->
      <div class="bg-slate-950/60 border-b border-slate-800/80 p-3 md:p-4 shrink-0 flex flex-col gap-2.5">
        
        <!-- Ligne 1 : Choix de la classe -->
        <div class="flex items-center gap-2 overflow-x-auto pb-1" id="class-selector-tabs">
          <!-- Injecté dynamiquement par app.js -->
        </div>

        <!-- Ligne 2 : Choix de la matière -->
        <div class="flex items-center gap-2 overflow-x-auto pb-1" id="subject-selector-tabs">
          <!-- Injecté dynamiquement par app.js -->
        </div>

        <!-- Ligne 3 : Suggestions rapides de notions du cours -->
        <div class="flex items-center gap-2 overflow-x-auto pt-1" id="topic-chips-container">
          <!-- Injecté dynamiquement par app.js -->
        </div>

      </div>

      <!-- Zone de conversation défilable avec formules KaTeX -->
      <div id="chat-scroll-area" class="flex-1 overflow-y-auto p-4 md:p-6 space-y-4">
        <div id="chat-messages-list">
          <!-- Les messages et cartes formules sont injectés ici -->
        </div>
      </div>

      <!-- Barre de saisie inférieure (Tactile & Clavier) -->
      <div class="p-3 md:p-4 bg-slate-950/90 border-t border-slate-800/80 shrink-0">
        <div class="flex items-center gap-2 bg-slate-900/90 border border-slate-700/80 rounded-2xl p-2 focus-within:border-cyan-400 transition-all shadow-lg">
          <input 
            type="text" 
            id="question-input" 
            placeholder="Pose ta question (ex: Donne-moi la formule de Moivre, Loi de Newton...)"
            class="flex-1 bg-transparent border-none outline-none px-3 text-sm md:text-base text-white placeholder-slate-500"
            autocomplete="off"
          >
          <button id="btn-send" class="touch-btn px-5 py-2.5 bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white rounded-xl font-bold text-sm flex items-center gap-1.5 shadow-md shadow-cyan-900/30">
            <span>Envoyer</span>
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
          </button>
        </div>
      </div>

    </section>

  </main>

  <!-- =========================================================================
       MODAL SPOTLIGHT FORMULE PLEIN ÉCRAN (ZOOM TACTILE)
       ========================================================================= -->
  <div id="formula-modal" class="formula-modal-overlay hidden">
    <div class="formula-modal-content">
      <div class="flex items-center justify-between border-b border-slate-700 pb-4 mb-4">
        <div class="flex items-center gap-2">
          <span class="w-3 h-3 rounded-full bg-cyan-400"></span>
          <h3 class="text-xl font-extrabold text-white">Formule Pédagogique Officielle</h3>
        </div>
        <button id="btn-close-formula-modal" class="touch-btn p-2 text-slate-400 hover:text-white rounded-lg bg-slate-800">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
      </div>
      
      <div id="formula-modal-math" class="text-2xl md:text-3xl text-center py-6 text-cyan-300 font-bold overflow-x-auto"></div>

      <div class="mt-4 pt-4 border-t border-slate-800">
        <h4 class="text-xs uppercase font-bold text-slate-400 tracking-wider mb-2">Variables & Unités :</h4>
        <div id="formula-modal-vars" class="flex flex-wrap gap-2"></div>
      </div>

      <div id="formula-modal-source" class="text-xs text-slate-400 mt-4 text-right italic"></div>
    </div>
  </div>

  <!-- Logique applicative -->
  <script src="app.js"></script>
</body>
</html>
